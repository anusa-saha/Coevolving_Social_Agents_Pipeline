[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-baselines"
version = "0.1.0"
description = "Six social-agent baselines ported to the CSA hidden-profile benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.37",
    "torch>=2.1",
    "peft>=0.6",
    "accelerate",
    "nltk",
    "huggingface_hub",
    "numpy",
]

[project.optional-dependencies]
# Report generation. matplotlib is here for its bundled DejaVu TTFs -- reportlab's
# base-14 fonts silently drop the maths glyphs the tables use.
reports = ["reportlab", "matplotlib"]
# API-backed experts and annotators (EPO stage 1, Omega corpus C).
api = ["openai>=1.0"]

[tool.setuptools]
# Only the shared contract is a package. The six baselines are flat script folders,
# run in place, and are deliberately not importable as modules.
packages = ["csa_core"]

[tool.ruff]
line-length = 90
